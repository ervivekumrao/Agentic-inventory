# -----------------------------------------------------------------------------
# 1. Standalone Logging Configuration
# -----------------------------------------------------------------------------
logging.config=config/logback-seeder.xml
logging.file=logs/migration-seeder.log
logging.level=INFO

# -----------------------------------------------------------------------------
# 2. Database Connection Configuration (Target DB)
# -----------------------------------------------------------------------------
db.url=jdbc:postgresql://localhost:5432/inventory
db.username=inventory
db.password=inventory
db.driver-class-name=org.postgresql.Driver

# -----------------------------------------------------------------------------
# 3. Flyway Schema Migration Settings
# -----------------------------------------------------------------------------
migration.enabled=true
migration.baseline-on-migrate=true
migration.locations=classpath:db/migration

# -----------------------------------------------------------------------------
# 4. Security Roles & Default Users Initialization
# -----------------------------------------------------------------------------
security.init-users=true
security.admin-password=admin123
security.manager-password=manager123
security.operator-password=operator123
security.viewer-password=viewer123

# -----------------------------------------------------------------------------
# 5. Bulk Inventory Reference Data Import Settings
# -----------------------------------------------------------------------------
seeding.enabled=true
seeding.file-path=samples/inventory_import_template.csv
seeding.batch-size=1000
