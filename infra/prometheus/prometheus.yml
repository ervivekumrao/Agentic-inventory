global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "inventory-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["inventory-service:8081"]

  - job_name: "catalog-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["catalog-service:8082"]
