services:
  postgres:
    image: postgres:15
    container_name: postgres_db
    profiles:
      - postgres
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: ${DB_USER:-inventory}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-inventory}
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-inventory} -d inventory"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - inventory-net

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql_db
    profiles:
      - mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD:-Password123!}"
      MSSQL_PID: "Express"
    ports:
      - "${DB_PORT:-1433}:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${DB_PASSWORD:-Password123!}' -Q 'SELECT 1' -C || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - inventory-net

  mysql:
    image: mysql:8
    container_name: mysql_db
    profiles:
      - mysql
    environment:
      MYSQL_DATABASE: inventory
      MYSQL_USER: "${DB_USER:-inventory}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-inventory}"
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:-inventory}"
    ports:
      - "${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USER:-inventory}", "--password=${DB_PASSWORD:-inventory}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - inventory-net

  oracle:
    image: gvenzl/oracle-free:slim-faststart
    container_name: oracle_db
    profiles:
      - oracle
    environment:
      ORACLE_PASSWORD: "${DB_PASSWORD:-inventory}"
      APP_USER: "${DB_USER:-inventory}"
      APP_PASSWORD: "${DB_PASSWORD:-inventory}"
    ports:
      - "${DB_PORT:-1521}:1521"
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - inventory-net

  db2:
    image: icr.io/db2_community/db2
    container_name: db2_db
    profiles:
      - db2
    environment:
      LICENSE: "accept"
      DB2INSTANCE: db2inst1
      DB2INST1_PASSWORD: "${DB_PASSWORD:-Password123!}"
      DBNAME: invdb
    ports:
      - "${DB_PORT:-50000}:50000"
    healthcheck:
      test: ["CMD-SHELL", "db2 ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - inventory-net
    privileged: true

  mongo:
    image: mongo:6
    container_name: mongo_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - inventory-net

  redis:
    image: redis:7.2-alpine
    container_name: redis_cache
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redispassword}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispassword}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - inventory-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - inventory-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - inventory-net

  inventory-service:
    build:
      context: ../inventory-service
      dockerfile: Dockerfile
    container_name: inventory-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/inventory}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-inventory}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-inventory}
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:-org.postgresql.Driver}
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT:-org.hibernate.dialect.PostgreSQLDialect}
      - INVENTORY_DB_TYPE=${INVENTORY_DB_TYPE:-POSTGRESQL}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - FORECASTING_SERVICE_URL=http://forecasting-service:8083
      - CATALOG_SERVICE_URL=http://catalog-service:8082
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD:-redispassword}
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
        required: false
      mssql:
        condition: service_healthy
        required: false
      mysql:
        condition: service_healthy
        required: false
      oracle:
        condition: service_healthy
        required: false
      db2:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - inventory-net

  catalog-service:
    build:
      context: ../catalog-service
      dockerfile: Dockerfile
    container_name: catalog-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongo:27017/catalog
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD:-redispassword}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - inventory-net

  forecasting-service:
    build:
      context: ../forecasting-service
      dockerfile: Dockerfile
    container_name: forecasting-service
    ports:
      - "8083:8083"
    depends_on:
      - inventory-service
      - catalog-service
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8083/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - inventory-net

networks:
  inventory-net:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
  redis_data:
