apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "smart-inventory.fullname" . }}-inventory-service
  labels:
    app.kubernetes.io/name: inventory-service
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.inventoryService.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory-service
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory-service
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: inventory-service
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          image: "{{ .Values.inventoryService.image.repository }}:{{ .Values.inventoryService.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.inventoryService.image.pullPolicy }}
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: SPRING_DATASOURCE_URL
              value: {{ .Values.inventoryService.env.springDatasourceUrl | quote }}
            - name: SPRING_DATASOURCE_USERNAME
              value: {{ .Values.inventoryService.env.springDatasourceUsername | quote }}
            - name: SPRING_DATASOURCE_PASSWORD
              value: {{ .Values.inventoryService.env.springDatasourcePassword | quote }}
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.inventoryService.env.springKafkaBootstrapServers | quote }}
            - name: FORECASTING_SERVICE_URL
              value: {{ .Values.inventoryService.env.forecastingServiceUrl | quote }}
            - name: CATALOG_SERVICE_URL
              value: {{ .Values.inventoryService.env.catalogServiceUrl | quote }}
            - name: INVENTORY_DB_TYPE
              value: {{ .Values.inventoryService.env.inventoryDbType | quote }}
          resources:
            {{- toYaml .Values.inventoryService.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  labels:
    app.kubernetes.io/name: inventory-service
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.inventoryService.service.type }}
  ports:
    - port: {{ .Values.inventoryService.service.port }}
      targetPort: 8081
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: inventory-service
    app.kubernetes.io/instance: {{ .Release.Name }}
