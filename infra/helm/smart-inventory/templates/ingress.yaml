apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "smart-inventory.fullname" . }}
  labels:
    app.kubernetes.io/name: smart-inventory
spec:
  ingressClassName: {{ .Values.ingress.className | default "nginx" | quote }}
  rules:
    - host: smart-inventory.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: inventory-service
                port:
                  number: 8081
          - path: /api/catalog
            pathType: Prefix
            backend:
              service:
                name: catalog-service
                port:
                  number: 8082
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: forecasting-service
                port:
                  number: 8083
