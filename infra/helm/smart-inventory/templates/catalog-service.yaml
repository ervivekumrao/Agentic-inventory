apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "smart-inventory.fullname" . }}-catalog-service
  labels:
    app.kubernetes.io/name: catalog-service
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.catalogService.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog-service
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog-service
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: catalog-service
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          image: "{{ .Values.catalogService.image.repository }}:{{ .Values.catalogService.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.catalogService.image.pullPolicy }}
          ports:
            - containerPort: 8082
              name: http
          env:
            - name: SPRING_DATA_MONGODB_URI
              value: {{ .Values.catalogService.env.springDataMongodbUri | quote }}
          resources:
            {{- toYaml .Values.catalogService.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 45
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
  labels:
    app.kubernetes.io/name: catalog-service
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.catalogService.service.type }}
  ports:
    - port: {{ .Values.catalogService.service.port }}
      targetPort: 8082
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: catalog-service
    app.kubernetes.io/instance: {{ .Release.Name }}
