apiVersion: v1
kind: Secret
metadata:
  name: {{ include "smart-inventory.fullname" . }}-secrets
  labels:
    {{- include "smart-inventory.labels" . | nindent 4 }}
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: {{ .Values.database.username | default "inventory" | quote }}
  SPRING_DATASOURCE_PASSWORD: {{ .Values.database.password | default "inventory123!" | quote }}
  GEMINI_API_KEY: {{ .Values.ai.geminiApiKey | default "" | quote }}
