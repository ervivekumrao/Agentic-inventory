# Default values for smart-inventory.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  environment: production

inventoryService:
  replicaCount: 1
  image:
    repository: smart-inventory-inventory-service
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8081
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi
  env:
    springDatasourceUrl: jdbc:postgresql://postgres-postgresql:5432/inventory
    springDatasourceUsername: inventory
    springDatasourcePassword: inventory
    springKafkaBootstrapServers: kafka:9092
    forecastingServiceUrl: http://forecasting-service:8083
    catalogServiceUrl: http://catalog-service:8082
    inventoryDbType: POSTGRESQL

catalogService:
  replicaCount: 1
  image:
    repository: smart-inventory-catalog-service
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8082
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi
  env:
    springDataMongodbUri: mongodb://mongodb:27017/catalog

forecastingService:
  replicaCount: 1
  image:
    repository: smart-inventory-forecasting-service
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8083
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi
  env:
    inventoryServiceUrl: http://inventory-service:8081
    catalogServiceUrl: http://catalog-service:8082

ingress:
  enabled: false
  className: "nginx"
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: smart-inventory.local
      paths:
        - path: /
          pathType: Prefix
          service: inventory-service
          port: 8081
        - path: /api/catalog
          pathType: Prefix
          service: catalog-service
          port: 8082
        - path: /docs
          pathType: Prefix
          service: forecasting-service
          port: 8083
  tls: []
