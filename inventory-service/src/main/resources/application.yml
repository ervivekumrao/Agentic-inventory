spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:inventory}}
    username: ${SPRING_DATASOURCE_USERNAME:inventory}
    password: ${SPRING_DATASOURCE_PASSWORD:inventory}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: ${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
  kafka:
    bootstrap-servers: ${KAFKA_HOST:localhost}:${KAFKA_PORT:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

forecasting:
  service:
    url: ${FORECASTING_SERVICE_URL:http://localhost:8083}

catalog:
  service:
    url: ${CATALOG_SERVICE_URL:http://localhost:8082}

server:
  port: ${SERVER_PORT:8081}

inventory:
  database:
    type: ${INVENTORY_DB_TYPE:POSTGRESQL}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,loggers
      cors:
        allowed-origins: "*"
        allowed-methods: "*"
        allowed-headers: "*"

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    com.smartinventory.inventory: INFO

app:
  security:
    default-admin-password: ${APP_SECURITY_DEFAULT_ADMIN_PASSWORD:admin123}
    default-manager-password: ${APP_SECURITY_DEFAULT_MANAGER_PASSWORD:manager123}
    default-operator-password: ${APP_SECURITY_DEFAULT_OPERATOR_PASSWORD:operator123}
    default-viewer-password: ${APP_SECURITY_DEFAULT_VIEWER_PASSWORD:viewer123}
